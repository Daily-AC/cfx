name: Bug report
description: Report reproducible incorrect behavior in cfx.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include Codeforces cookies, extension tokens, passwords, or other credentials.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and the smallest sequence that reproduces the problem.
      placeholder: |
        cfx doctor
        cfx ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cfx version or commit
      placeholder: v0.1.0 or ac65244
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant output from cfx doctor and the failing command after removing personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I removed cookies, tokens, passwords, and other credentials from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
